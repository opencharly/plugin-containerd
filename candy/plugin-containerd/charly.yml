# plugin-containerd — the out-of-tree charly ENGINE plugin serving `engine:containerd`.
#
# A standalone Go module served over go-plugin gRPC via the charly plugin SDK; the
# charly loader host-builds ./cmd/serve and connects it OUT-OF-PROCESS. It answers
# every engine op by delegating to the pure body container.InvokeEngineOp in the
# spec module — the SAME body the compiled-in engine:podman/engine:docker providers
# serve — so the engine class has one implementation and two placements.
#
# `containerd` is the ENGINE WORD. `nerdctl` is only the CLI binary that drives it
# (#EngineBinaries maps containerd -> nerdctl); the retired engine spelling is gone
# (R5, no alias).
plugin-containerd:
    candy:
        description: |
            The out-of-tree charly ENGINE plugin serving engine:containerd (plus the
            verb:containerd / command:containerd convenience words). containerd is the
            engine word; nerdctl is the CLI binary named by the CUE-owned #EngineBinaries
            map, never a literal here. It answers the engine provider-class op envelope
            (describe / binary / gpu_args / start_plan / unit_emit / network_ensure) by
            delegating to the pure body container.InvokeEngineOp("containerd", …) in the
            spec module, so the engine class has one implementation served from either
            placement. Its start plan always names an OCI runtime handler (nerdctl's
            unqualified default is runc, the CRI default crun) and prefixes a rootful
            plan with the capability's privilege_prefix (e.g. sudo -n), so a rootful
            request is never silently run as rootless; the capability defaults for
            address and namespace are never re-spelled. The unit_emit op is a pure
            renderer and its envelope carries no scope field: a rootful unit is a user
            unit whose ExecStart is the (prefixed, --runtime-bearing) start-plan argv
            the caller supplies, and this provider does not re-apply the policy at the
            unit boundary. The verb:containerd word additionally serves the READ-ONLY
            check verbs (W3.9), each able to FAIL on a defect nothing else catches:
            info (daemon id + mode from nerdctl info SecurityOptions — Plugins is never
            a mode source), runtimes (the declared CRI handlers via crictl info),
            cdi_devices (the CLIENT's CDI spec dirs), criu_preflight (rc AND the
            seccomp_suspend line; --extra is never used), krun_guest (one throwaway
            probe guest: kernel + CPU features) and image (present in a named
            namespace). A capability the venue lacks is a visible skip naming the
            mechanism, never a silent pass. A standalone Go module
            (go.mod + cmd/serve) host-built and connected over go-plugin gRPC. Composes
            with the layer-nerdctl candy (the packages + rootless
            containerd/buildkit/CNI stack) to deploy a pod with engine: containerd.
        plugin:
            providers:
                - engine:containerd
                - verb:containerd
                - command:containerd
            source: github.com/opencharly/plugin-containerd/candy/plugin-containerd
            primary:
                containerd: method
        plan:
            - check: the out-of-tree engine:containerd plugin ships a buildable Go module (go.mod + cmd/serve) the host can build + serve out-of-process
              id: containerd-module-present
              context:
                - build
              command: "true"
            - check: the plugin declares the engine:containerd provider word
              id: containerd-provider-declared
              context:
                - build
              command: grep -q 'engine:containerd' charly.yml
            - check: the served schema declares the typed verb:containerd input and its full method set
              id: containerd-check-verbs-declared
              context:
                - build
              command: grep -q '#ContainerdInput' schema/plugin.cue && grep -q 'criu_preflight' schema/plugin.cue && grep -q 'krun_guest' schema/plugin.cue

# ---- HARNESS SKILL ----
# Owner registration for the skill body at .agents/skills/plugin-containerd/SKILL.md,
# the one canonical base the corpus reader resolves. This entity names the owner
# (name/family/owner) and carries no body; the body is the file at the repo root.
plugin-containerd-skill:
    skill:
        name: plugin-containerd
        family: internals
        owner: plugin-containerd
